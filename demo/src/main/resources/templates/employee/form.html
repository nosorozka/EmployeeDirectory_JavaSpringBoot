<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
          integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <title>Add Employee</title>
    <style>
        body {
            padding-top: 20px;
        }

        .header {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2 th:text="${employee.id} != 0 ? 'UBIAN - Upraviť existujúceho zamestnanca' : 'UBIAN - Pridať nového zamestnanca'"></h2>
    </div>

    <form th:action="@{/employees/save}" th:object="${employee}" method="post">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Informácie o zamestnancovi</h5>
                <!-- Skryté pole formulára pre zabezpečenie update záznamu -->
                <input type="hidden" th:field="*{id}"/>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">Meno</label>
                        <input type="text" class="form-control" id="firstName" th:field="*{firstName}"
                               placeholder="Zadajte Vaše meno" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Priezvisko</label>
                        <input type="text" class="form-control" id="lastName" th:field="*{lastName}"
                               placeholder="Zadajte Vaše priezvisko" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="birthDate" class="form-label">Dátum narodenia</label>
                        <input type="date" class="form-control" id="birthDate" th:field="*{birthDate}" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="birthDate" class="form-label">JobTitle</label>
<!--                        <input type="text" class="form-control" id="jobTitle" th:field="*{jobTitle}" required>-->
                        <select class="form-select col-md-6" th:field="*{jobTitle}" required>
                            <!--        <option th:value="Slovensko">Brazil</option>-->
                            <option th:each="tempJobTitle : ${jobTitle}" th:value="${tempJobTitle}" th:text="${tempJobTitle}"/>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}"
                               placeholder="Vložte Vašu emailovú adresu" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="form-label">Telefón</label>
                        <input type="tel" class="form-control" id="phone" th:field="*{phone}"
                               placeholder="Zadajte svoje telefónne číslo">
                        <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="credit" class="form-label">Salary</label>
                        <input type="number" step="1" class="form-control" id="credit"
                               th:field="*{salary}" placeholder="Zadajte kredit" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="credit" class="form-label">Druh pracovného pomeru</label>
                        <div>
                            <input class="btn-check" type="radio" id="PlnyUvazok" th:field="*{fullTime}" value="1" required>
                            <label class="btn btn-outline-secondary rounded-pill" for="PlnyUvazok">Plný úväzok</label>

                            <input class="btn-check" type="radio" id="CiastocnyUvazok" th:field="*{fullTime}" value="0">
                            <label class="btn btn-outline-secondary rounded-pill" for="CiastocnyUvazok">Čiastočný úväzok</label>

                            <input class="btn-check" type="radio" id="Dohoda" th:field="*{fullTime}" value="1" required>
                            <label class="btn btn-outline-secondary rounded-pill" for="Dohoda">Dohoda</label>

                            <input class="btn-check" type="radio" id="Praktikant" th:field="*{fullTime}" value="0">
                            <label class="btn btn-outline-secondary rounded-pill" for="Praktikant">Stážista/Praktikаnt</label>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <a th:href="@{/employees/list}" class="btn btn-secondary">Späť na zoznam</a>
                    <button type="submit" class="btn btn-primary"
                    th:text="${employee.id} != 0 ? 'Upraviť zamestnanca' : 'Pridať zamestnanca'"></button>
                </div>
            </div>
<!--        </div>-->
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-cu3wyZ4uGpNuxFcbXcvrkjkXckI/4L33U4o22Z7FJ3d3wM4l8QKjTn4A4Vb8RPSz8"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js" integrity="sha512-..."
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

</body>
</html>
@nosorozka
